<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="ParkSmart project preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="55%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#C27D88"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2">
    <rect x="60" y="330" width="90" height="90" rx="10"/>
    <rect x="175" y="330" width="90" height="90" rx="10"/>
    <rect x="290" y="330" width="90" height="90" rx="10"/>
    <rect x="405" y="330" width="90" height="90" rx="10"/>
    <rect x="520" y="330" width="90" height="90" rx="10"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.1">
    <rect x="175" y="330" width="90" height="90" rx="10"/>
    <rect x="405" y="330" width="90" height="90" rx="10"/>
  </g>
  <text x="60" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="6" fill="#FDFBF7" fill-opacity="0.7">SMART CITY SOLUTION</text>
  <text x="60" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" fill="#FDFBF7">ParkSmart</text>
  <text x="60" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#FDFBF7" fill-opacity="0.75">Real-time parking reservations</text>
</svg>
